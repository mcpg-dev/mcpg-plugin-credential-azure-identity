[package]
name = "mcpg-plugin-credential-azure-identity"
version = "0.1.0-alpha.19"
license = "BUSL-1.1"
edition = "2024"
description = "Azure AD (Entra) workload-identity credential_issuer plugin for MCPG — per-target downstream-resource bearer tokens"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
metrics = "0.24"
# rustls-only (deny.toml bans openssl/native-tls).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
# Offline HTTP-contract tests against a mock Entra v2 / IMDS endpoint
# (no docker, no cloud); runs in the push lane.
wiremock = "0.6"
tempfile = "3"

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's static-firstparty fast path does not trip
# `unexpected_cfgs`. Empty: this plugin is consumed as a cdylib.
static-firstparty = []
